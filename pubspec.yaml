name: curioso_app
description: "Aplicación Curioso"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.7.2

dependencies:
  flutter:
    sdk: flutter
  http: ^1.2.0
  shared_preferences: ^2.2.2
  url_launcher: ^6.2.4
  cupertino_icons: ^1.0.6
  uuid: ^4.5.1
  crypto: ^3.0.3
  share_plus: ^10.1.4
  app_links: ^6.4.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_native_splash: ^2.4.5
  flutter_launcher_icons: ^0.14.3

flutter:
  uses-material-design: true
  assets:
    - assets/images/

flutter_native_splash:
  color: "#4A148C"
  image: assets/images/icono_curioso.png
  android: true
  ios: true
  web: false
  android_12:
    image: assets/images/icono_curioso.png
    color: "#4A148C"
    icon_background_color: "#4A148C"

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/images/icono_curioso.png"
  min_sdk_android: 21